server {
    listen 80;
    server_name mail.gobitsnbytes.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name mail.gobitsnbytes.org;

    ssl_certificate /etc/letsencrypt/live/mail.gobitsnbytes.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.gobitsnbytes.org/privkey.pem;

    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        auth_basic "Mail Admin";
        auth_basic_user_file /etc/nginx/.mailadmin.htpasswd;

        proxy_pass http://127.0.0.1:8501/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 86400;
    }

    location /webhooks/calcom {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}
